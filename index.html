<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تحرير الفيديو – منصة أغورط</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.6/dist/umd/ffmpeg.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #021533; font-family: 'Cairo', sans-serif; padding: 25px 15px; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; color: #e0e9f5; }
    .app-wrapper { max-width: 1350px; width: 100%; }
    .container { background: #0f1f33; border-radius: 36px; padding: 25px; box-shadow: 0 25px 55px rgba(0,0,0,0.6); border: 1px solid #2a4060; display: flex; flex-wrap: wrap; gap: 24px; }
    .controls { flex: 1; min-width: 280px; background: #0b1a2e; border-radius: 26px; padding: 22px; border: 1px solid #2e4a6a; max-height: 88vh; overflow-y: auto; }
    .controls h2 { color: #00FF00; font-size: 1.6rem; margin-bottom: 18px; border-bottom: 2px solid #00FF0040; padding-bottom: 12px; display: flex; align-items: center; gap: 10px; }
    .ctrl-group { margin-bottom: 14px; }
    .ctrl-group label { display: block; font-weight: 600; font-size: 0.85rem; color: #b8d0e8; margin-bottom: 5px; }
    .ctrl-group input, .ctrl-group select { width: 100%; padding: 10px 14px; border-radius: 12px; border: 1px solid #2e4a6a; background: #0b1a2a; color: #fff; font-size: 0.9rem; font-family: 'Cairo', sans-serif; transition: 0.2s; outline: none; }
    .ctrl-group input:focus { border-color: #00FF00; box-shadow: 0 0 0 3px rgba(0,255,0,0.15); }
    .btn-group { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
    .btn-group button { flex: 1; min-width: 85px; padding: 13px 18px; border: none; border-radius: 40px; font-weight: 700; font-size: 0.95rem; cursor: pointer; transition: 0.25s; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: 'Cairo', sans-serif; }
    .btn-record { background: #00FF00; color: #021533; }
    .btn-record:hover { background: #00cc00; transform: scale(1.02); }
    .btn-stop { background: #ff4757; color: white; }
    .btn-stop:hover { background: #e84118; }
    .btn-download { background: #2e7d32; color: white; }
    .btn-download:hover { background: #1b5e20; }
    .btn-download:disabled { opacity: 0.5; cursor: not-allowed; }
    .status { background: rgba(0,255,0,0.08); border: 1px solid #00FF0050; padding: 10px; border-radius: 20px; margin-top: 12px; font-size: 0.85rem; text-align: center; color: #00FF00; }
    .status.recording { background: rgba(255,71,87,0.1); border-color: #ff475780; color: #ff4757; animation: pulse 1.2s infinite; }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }
    .preview { flex: 1.8; min-width: 360px; background: #0b1a2a; border-radius: 26px; padding: 18px; border: 1px solid #2e4a6a; display: flex; flex-direction: column; align-items: center; }
    .preview h3 { color: #00FF00; margin-bottom: 12px; }
    .canvas-wrapper { width: 100%; display: flex; justify-content: center; }
    #videoCanvas { width: 100%; max-width: 100%; height: auto; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); border: 2px solid #2a4060; background: black; aspect-ratio: auto; }
    .video-controls { display: flex; align-items: center; gap: 12px; margin-top: 12px; width: 100%; max-width: 700px; flex-wrap: wrap; justify-content: center; }
    .video-controls button { background: #1a2f3f; border: 1px solid #2e4a6a; color: white; width: 42px; height: 42px; border-radius: 50%; font-size: 1.1rem; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
    .video-controls button:hover { background: #00FF0030; border-color: #00FF00; }
    .video-controls input[type="range"] { flex: 1; min-width: 100px; accent-color: #00FF00; }
    .time { color: #b8d0e8; font-size: 0.9rem; min-width: 90px; text-align: center; }
    .hint { color: #7a9bbf; font-size: 0.8rem; margin-top: 10px; }
    @media (max-width: 850px) { .container { flex-direction: column; } .controls { max-height: none; } }
  </style>
</head>
<body>
<div class="app-wrapper">
  <div class="container">
    <div class="controls">
      <h2><i class="fas fa-video"></i> تحرير الفيديو – نسخة محسنة</h2>
      <div class="ctrl-group">
        <label>📹 رفع فيديو</label>
        <input type="file" id="videoUpload" accept="video/*">
      </div>
      <div class="ctrl-group">
        <label>✏️ اسم الصفحة (يظهر أعلى الفيديو)</label>
        <input type="text" id="pageNameInput" value="منصة أغورط الإخبارية" maxlength="40">
      </div>
      <div class="ctrl-group">
        <label>📝 نص الخبر (يظهر أسفل الفيديو)</label>
        <input type="text" id="newsTextInput" value="جماهير نواكشوط في استقبال ولد عبد العزيز بعد منعه من دخول ولاية" maxlength="150">
      </div>
      <div class="ctrl-group">
        <label>🎨 لون النقش الفسفوري</label>
        <input type="color" id="goldColor" value="#00FF00">
      </div>
      <div class="ctrl-group">
        <label>⚙️ جودة التسجيل</label>
        <select id="qualitySelect">
          <option value="high" selected>عالية (8 ميجابت)</option>
          <option value="medium">متوسطة (5 ميجابت)</option>
          <option value="low">منخفضة (3 ميجابت)</option>
        </select>
      </div>
      <div class="btn-group">
        <button class="btn-record" id="btnRecord"><i class="fas fa-record-vinyl"></i> تسجيل</button>
        <button class="btn-stop" id="btnStop" disabled><i class="fas fa-stop-circle"></i> إيقاف</button>
        <button class="btn-download" id="btnDownload" disabled><i class="fas fa-download"></i> تحميل MP4</button>
      </div>
      <div id="statusBadge" class="status"><i class="fas fa-check-circle"></i> جاهز – ⏳ محول MP4 قيد التحميل...</div>
    </div>
    <div class="preview">
      <h3><i class="fas fa-eye"></i> المعاينة</h3>
      <div class="canvas-wrapper"><canvas id="videoCanvas"></canvas></div>
      <div class="video-controls">
        <button id="btnPlayPause"><i class="fas fa-play"></i></button>
        <button id="btnRestart"><i class="fas fa-redo-alt"></i></button>
        <input type="range" id="progressBar" value="0" min="0" max="100" step="0.1">
        <span class="time" id="timeDisplay">00:00 / 00:00</span>
        <button id="btnMute"><i class="fas fa-volume-up"></i></button>
        <button id="btnFullscreen" title="معاينة كاملة"><i class="fas fa-expand"></i></button>
      </div>
      <div class="hint"><i class="fas fa-info-circle"></i> نص مصغر جداً ليتناسب مع جميع الشاشات.</div>
    </div>
  </div>
</div>

<script>
// ============================================================
//  نظام تسجيل متطور – مع نص مصغر جداً
// ============================================================

const { FFmpeg } = FFmpegWASM;

let ffmpegReady = false, ffmpegInstance = null, ffmpegLoading = false;

async function prepareFFmpeg() {
  if (ffmpegReady && ffmpegInstance) return ffmpegInstance;
  if (ffmpegLoading) {
    return new Promise((resolve) => {
      const check = setInterval(() => {
        if (ffmpegReady) { clearInterval(check); resolve(ffmpegInstance); }
      }, 300);
    });
  }
  ffmpegLoading = true;
  try {
    const ffmpeg = new FFmpeg();
    await ffmpeg.load();
    ffmpegInstance = ffmpeg;
    ffmpegReady = true;
    document.getElementById('statusBadge').innerHTML = '<i class="fas fa-check-circle"></i> ✅ محول MP4 جاهز';
    return ffmpeg;
  } catch (e) {
    console.error('فشل تحميل FFmpeg:', e);
    ffmpegReady = false;
    document.getElementById('statusBadge').innerHTML = '<i class="fas fa-exclamation-triangle"></i> ⚠️ تعذر تحميل محول MP4';
    throw e;
  } finally {
    ffmpegLoading = false;
  }
}

window.addEventListener('load', () => {
  setTimeout(() => prepareFFmpeg().catch(() => {}), 500);
});

async function convertWebMToMP4(webmBlob) {
  const ffmpeg = await prepareFFmpeg();
  const inputBytes = new Uint8Array(await webmBlob.arrayBuffer());
  await ffmpeg.writeFile('input.webm', inputBytes);
  await ffmpeg.exec([
    '-i', 'input.webm',
    '-c:v', 'libx264',
    '-profile:v', 'high',
    '-level', '4.0',
    '-pix_fmt', 'yuv420p',
    '-movflags', '+faststart',
    '-preset', 'slow',
    '-crf', '17',
    '-b:v', '4M',
    '-maxrate', '8M',
    '-bufsize', '16M',
    '-c:a', 'aac',
    '-b:a', '192k',
    '-ac', '2',
    'output.mp4'
  ]);
  const outputData = await ffmpeg.readFile('output.mp4');
  return new Blob([outputData], { type: 'video/mp4' });
}

// ----- عناصر الواجهة -----
const canvas = document.getElementById('videoCanvas');
const ctx = canvas.getContext('2d');
const video = document.createElement('video');
video.crossOrigin = 'anonymous';
video.playsInline = true;
video.preload = 'auto';

const videoUpload = document.getElementById('videoUpload');
const pageNameInput = document.getElementById('pageNameInput');
const newsTextInput = document.getElementById('newsTextInput');
const goldColorInp = document.getElementById('goldColor');
const qualitySelect = document.getElementById('qualitySelect');
const btnRecord = document.getElementById('btnRecord');
const btnStop = document.getElementById('btnStop');
const btnDownload = document.getElementById('btnDownload');
const statusBadge = document.getElementById('statusBadge');
const btnPlayPause = document.getElementById('btnPlayPause');
const btnRestart = document.getElementById('btnRestart');
const progressBar = document.getElementById('progressBar');
const timeDisplay = document.getElementById('timeDisplay');
const btnMute = document.getElementById('btnMute');
const btnFullscreen = document.getElementById('btnFullscreen');

let videoLoaded = false, isPlaying = false, isRecording = false;
let mediaRecorder = null, recordedChunks = [];
let animFrame = null;
let canvasStream = null;
let audioContext = null, audioDestination = null, audioSource = null;

// حجم النص المصغر جداً
const FONT_SIZE = 22; // صغير جداً
const FONT_SIZE_NEWS = 22; // نفس الحجم للخبر

// ----- دالة تقسيم النص إلى سطرين حسب العرض -----
function splitTextIntoLines(text, maxWidth, fontSize, fontFamily) {
  if (!text) return [];
  ctx.font = `bold ${fontSize}px "${fontFamily}","Tahoma",sans-serif`;
  const words = text.split(' ');
  if (words.length === 0) return [];
  let lines = [];
  let currentLine = words[0];
  for (let i = 1; i < words.length; i++) {
    const testLine = currentLine + ' ' + words[i];
    const metrics = ctx.measureText(testLine);
    if (metrics.width > maxWidth) {
      lines.push(currentLine);
      currentLine = words[i];
    } else {
      currentLine = testLine;
    }
  }
  lines.push(currentLine);
  // إذا كان هناك أكثر من سطرين، ندمج الزائد في السطر الثاني
  if (lines.length > 2) {
    const allWords = text.split(' ');
    const mid = Math.floor(allWords.length / 2);
    const line1 = allWords.slice(0, mid).join(' ');
    const line2 = allWords.slice(mid).join(' ');
    if (line2.trim() === '') return [line1];
    let finalLines = [];
    let tempLine = '';
    for (let i = 0; i < allWords.length; i++) {
      const testLine = tempLine + (tempLine ? ' ' : '') + allWords[i];
      if (ctx.measureText(testLine).width > maxWidth) {
        if (finalLines.length < 2) {
          finalLines.push(tempLine);
          tempLine = allWords[i];
        } else {
          finalLines[1] += ' ' + allWords[i];
        }
      } else {
        tempLine = testLine;
      }
    }
    if (tempLine) {
      if (finalLines.length < 2) finalLines.push(tempLine);
      else finalLines[1] += ' ' + tempLine;
    }
    if (finalLines.length > 2) {
      for (let i = 2; i < finalLines.length; i++) {
        finalLines[1] += ' ' + finalLines[i];
      }
      finalLines = finalLines.slice(0, 2);
    }
    return finalLines;
  }
  return lines;
}

// ----- دالة الرسم -----
function drawFrame() {
  const W = canvas.width, H = canvas.height;
  if (W === 0 || H === 0) return;
  ctx.clearRect(0, 0, W, H);

  // رسم الفيديو
  if (videoLoaded && video.readyState >= 2 && video.videoWidth) {
    const vidAspect = video.videoWidth / video.videoHeight;
    const canvasAspect = W / H;
    let drawW, drawH, dx, dy;
    if (vidAspect > canvasAspect) {
      drawW = W;
      drawH = W / vidAspect;
      dx = 0;
      dy = (H - drawH) / 2;
    } else {
      drawH = H;
      drawW = H * vidAspect;
      dx = (W - drawW) / 2;
      dy = 0;
    }
    ctx.drawImage(video, dx, dy, drawW, drawH);
  } else {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#5a7a9a';
    let fs = Math.min(14, W * 0.025);
    ctx.font = `${fs}px "Cairo"`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('📹 ارفع فيديو', W / 2, H / 2);
  }

  const gold = goldColorInp.value || '#00FF00';

  // ----- اسم الصفحة في الأعلى (مصغر جداً) -----
  const pageName = pageNameInput.value.trim() || 'منصة أغورط الإخبارية';
  const fullText = '👤 ' + pageName;
  const fontSize = FONT_SIZE;
  const fontFamily = 'Cairo';

  ctx.save();
  ctx.shadowBlur = 12;
  ctx.shadowColor = gold + '80';
  ctx.font = `bold ${fontSize}px "${fontFamily}","Tahoma",sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillStyle = gold;
  ctx.fillText(fullText, W / 2, 10);
  ctx.shadowBlur = 0;
  ctx.strokeStyle = gold;
  ctx.lineWidth = 1.5;
  ctx.strokeText(fullText, W / 2, 10);

  // خط زخرفي صغير تحت الاسم
  const metrics = ctx.measureText(fullText);
  const textWidth = metrics.width;
  const xStart = (W - textWidth) / 2;
  const yLine = 10 + fontSize + 4;
  ctx.beginPath();
  ctx.moveTo(xStart, yLine);
  ctx.lineTo(xStart + textWidth, yLine);
  ctx.strokeStyle = gold;
  ctx.lineWidth = 2;
  ctx.shadowBlur = 6;
  ctx.shadowColor = gold + '50';
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(xStart + textWidth, yLine, 4, 0, Math.PI * 2);
  ctx.fillStyle = gold;
  ctx.shadowBlur = 8;
  ctx.shadowColor = gold + '70';
  ctx.fill();
  ctx.restore();

  // ----- نص الخبر في الأسفل (مصغر جداً) -----
  const newsText = newsTextInput.value.trim() || 'جماهير نواكشوط في استقبال ولد عبد العزيز بعد منعه من دخول ولاية';
  if (newsText) {
    const fontSizeNews = FONT_SIZE_NEWS;
    const maxWidth = W - 30;
    ctx.save();
    ctx.font = `bold ${fontSizeNews}px "${fontFamily}","Tahoma",sans-serif`;
    let lines = splitTextIntoLines(newsText, maxWidth, fontSizeNews, fontFamily);
    if (lines.length === 1) lines = [lines[0], ''];

    const lineHeight = fontSizeNews * 1.3;
    const totalHeight = lines.length * lineHeight;
    const bottomY = H - 12;
    const startY = bottomY - totalHeight;

    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      if (!line) continue;
      const yPos = startY + i * lineHeight + fontSizeNews;
      ctx.shadowBlur = 12;
      ctx.shadowColor = gold + '80';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      ctx.fillStyle = gold;
      ctx.fillText(line, W / 2, yPos);
      ctx.shadowBlur = 0;
      ctx.strokeStyle = gold;
      ctx.lineWidth = 1.5;
      ctx.strokeText(line, W / 2, yPos);
    }

    // خط زخرفي فوق السطر الأول
    const firstLine = lines[0];
    if (firstLine) {
      ctx.font = `bold ${fontSizeNews}px "${fontFamily}","Tahoma",sans-serif`;
      const lineWidth = ctx.measureText(firstLine).width;
      const xStartNews = (W - lineWidth) / 2;
      const yLineNews = startY + fontSizeNews * 0.2;
      ctx.beginPath();
      ctx.moveTo(xStartNews, yLineNews);
      ctx.lineTo(xStartNews + lineWidth, yLineNews);
      ctx.strokeStyle = gold;
      ctx.lineWidth = 2;
      ctx.shadowBlur = 6;
      ctx.shadowColor = gold + '50';
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(xStartNews + lineWidth, yLineNews, 4, 0, Math.PI * 2);
      ctx.fillStyle = gold;
      ctx.shadowBlur = 8;
      ctx.shadowColor = gold + '70';
      ctx.fill();
    }
    ctx.restore();
  }

  // تحديث شريط التقدم
  if (videoLoaded && video.duration) {
    const pct = (video.currentTime / video.duration) * 100;
    if (!isNaN(pct) && document.activeElement !== progressBar) progressBar.value = pct;
    timeDisplay.textContent = `${fmtTime(video.currentTime)} / ${fmtTime(video.duration)}`;
  } else if (!videoLoaded) {
    timeDisplay.textContent = '00:00 / 00:00';
    progressBar.value = 0;
  }
}

function fmtTime(s) {
  if (isNaN(s)) return '00:00';
  const m = Math.floor(s / 60), sec = Math.floor(s % 60);
  return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}

function startLoop() {
  if (animFrame) cancelAnimationFrame(animFrame);
  (function loop() {
    drawFrame();
    if (isPlaying || isRecording) animFrame = requestAnimationFrame(loop);
  })();
}
function stopLoop() {
  if (animFrame) { cancelAnimationFrame(animFrame); animFrame = null; }
  drawFrame();
}

function play() {
  if (!videoLoaded) return;
  video.play().then(() => {
    isPlaying = true;
    btnPlayPause.innerHTML = '<i class="fas fa-pause"></i>';
    startLoop();
  }).catch(() => { isPlaying = false; });
}
function pause() {
  video.pause();
  isPlaying = false;
  btnPlayPause.innerHTML = '<i class="fas fa-play"></i>';
  stopLoop();
}
btnPlayPause.onclick = () => isPlaying ? pause() : play();
btnRestart.onclick = () => {
  if (videoLoaded) {
    video.currentTime = 0;
    if (!isPlaying) drawFrame();
  }
};
progressBar.oninput = () => {
  if (videoLoaded && !isRecording) {
    video.currentTime = (progressBar.value / 100) * video.duration;
    drawFrame();
  }
};
btnMute.onclick = () => {
  video.muted = !video.muted;
  btnMute.innerHTML = video.muted ? '<i class="fas fa-volume-mute"></i>' : '<i class="fas fa-volume-up"></i>';
};
video.onended = () => { if (isRecording) stopRecording(); else pause(); };
btnFullscreen.onclick = () => {
  if (canvas.requestFullscreen) canvas.requestFullscreen().catch(() => {});
  else if (canvas.webkitRequestFullscreen) canvas.webkitRequestFullscreen();
};

videoUpload.onchange = e => {
  const file = e.target.files[0];
  if (!file) return;
  if (isRecording) stopRecording(true);
  pause();
  video.src = URL.createObjectURL(file);
  video.load();
  videoLoaded = false;
  statusBadge.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> جاري التحميل...';
  statusBadge.className = 'status';
  video.onloadedmetadata = () => {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    videoLoaded = true;
    video.currentTime = 0;
    statusBadge.innerHTML = '<i class="fas fa-check-circle"></i> الفيديو جاهز';
    statusBadge.className = 'status';
    drawFrame();
  };
  video.onerror = () => {
    videoLoaded = false;
    statusBadge.innerHTML = '<i class="fas fa-exclamation-triangle"></i> خطأ في الفيديو';
    statusBadge.className = 'status';
  };
};

function setupAudioContext() {
  if (audioContext) return audioContext;
  try {
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    audioDestination = audioContext.createMediaStreamDestination();
    audioSource = audioContext.createMediaElementSource(video);
    audioSource.connect(audioDestination);
    audioSource.connect(audioContext.destination);
    return audioContext;
  } catch (e) { return null; }
}

function setupRecorder() {
  if (!videoLoaded) {
    statusBadge.innerHTML = '<i class="fas fa-exclamation-triangle"></i> ارفع فيديو أولاً';
    statusBadge.className = 'status recording';
    setTimeout(() => {
      if (statusBadge.className === 'status recording') {
        statusBadge.innerHTML = '<i class="fas fa-check-circle"></i> جاهز';
        statusBadge.className = 'status';
      }
    }, 3000);
    return null;
  }

  canvasStream = canvas.captureStream(30);
  let audioStream = null;
  const ctx = setupAudioContext();
  if (ctx && audioDestination) {
    audioStream = audioDestination.stream;
    if (ctx.state === 'suspended') ctx.resume().catch(() => {});
  } else {
    try {
      const fallback = video.captureStream();
      const audioTracks = fallback.getAudioTracks();
      if (audioTracks.length) audioStream = new MediaStream(audioTracks);
    } catch (e) {}
  }
  if (!audioStream || audioStream.getAudioTracks().length === 0) {
    console.warn('لا يوجد صوت، التسجيل بدون صوت');
    audioStream = null;
  }
  const tracks = canvasStream.getVideoTracks();
  if (audioStream) tracks.push(...audioStream.getAudioTracks());
  const combinedStream = new MediaStream(tracks);

  let mimeType = 'video/webm';
  if (MediaRecorder.isTypeSupported('video/webm;codecs=vp9')) mimeType = 'video/webm;codecs=vp9';
  else if (MediaRecorder.isTypeSupported('video/webm;codecs=vp8')) mimeType = 'video/webm;codecs=vp8';

  let bitrate = 8000000;
  const q = qualitySelect.value;
  if (q === 'medium') bitrate = 5000000;
  else if (q === 'low') bitrate = 3000000;

  mediaRecorder = new MediaRecorder(combinedStream, {
    mimeType, videoBitsPerSecond: bitrate, audioBitsPerSecond: 256000
  });
  recordedChunks = [];
  mediaRecorder.ondataavailable = e => { if (e.data.size) recordedChunks.push(e.data); };
  mediaRecorder.onstop = async () => {
    const webmBlob = new Blob(recordedChunks, { type: 'video/webm' });
    statusBadge.innerHTML = '<i class="fas fa-cog fa-spin"></i> جاري تحويل إلى MP4...';
    statusBadge.className = 'status';
    try {
      const mp4Blob = await convertWebMToMP4(webmBlob);
      const url = URL.createObjectURL(mp4Blob);
      btnDownload.disabled = false;
      btnDownload.onclick = () => {
        const a = document.createElement('a');
        a.href = url;
        a.download = 'فيديو_أغورط_' + Date.now() + '.mp4';
        a.click();
      };
      statusBadge.innerHTML = '<i class="fas fa-check-circle"></i> التسجيل اكتمل (MP4)';
      statusBadge.className = 'status';
    } catch (e) {
      console.error(e);
      const url = URL.createObjectURL(webmBlob);
      btnDownload.disabled = false;
      btnDownload.onclick = () => {
        const a = document.createElement('a');
        a.href = url;
        a.download = 'فيديو_أغورط_' + Date.now() + '.webm';
        a.click();
      };
      statusBadge.innerHTML = '<i class="fas fa-exclamation-triangle"></i> تعذر تحويل MP4. تم توفير WebM.';
      statusBadge.className = 'status';
    }
  };
  return mediaRecorder;
}

function startRecording() {
  const rec = setupRecorder();
  if (!rec) return;
  video.currentTime = 0;
  video.muted = false;
  rec.start(1000);
  isRecording = true;
  btnRecord.disabled = true;
  btnStop.disabled = false;
  btnDownload.disabled = true;
  statusBadge.innerHTML = '<i class="fas fa-circle"></i> جاري التسجيل...';
  statusBadge.className = 'status recording';
  if (!isPlaying) {
    video.play().then(() => { isPlaying = true; btnPlayPause.innerHTML = '<i class="fas fa-pause"></i>'; startLoop(); }).catch(() => {});
  } else { startLoop(); }
}

function stopRecording(silent = false) {
  if (!isRecording) return;
  if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
  isRecording = false;
  btnRecord.disabled = false;
  btnStop.disabled = true;
  if (!silent) {
    statusBadge.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> معالجة...';
    statusBadge.className = 'status';
  }
  if (isPlaying) pause();
}

btnRecord.onclick = startRecording;
btnStop.onclick = () => stopRecording();

pageNameInput.addEventListener('input', () => { if (!isPlaying && !isRecording) drawFrame(); });
newsTextInput.addEventListener('input', () => { if (!isPlaying && !isRecording) drawFrame(); });
goldColorInp.addEventListener('input', () => { if (!isPlaying && !isRecording) drawFrame(); });

canvas.width = 715; canvas.height = 408; drawFrame();

document.addEventListener('click', () => {
  if (audioContext && audioContext.state === 'suspended') audioContext.resume().catch(() => {});
}, { once: true });

</script>
